.analysis-card{padding:23px;min-width:0}
.analysis-card h3{font-size:18px;line-height:1.3;margin:0 0 8px}
.analysis-sub{color:#6b8577;font-size:12px;line-height:1.6;margin:8px 0 14px}
.analysis-two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.analysis-two label{font-size:11px;font-weight:700;color:#51685e}
.analysis-two select,.analysis-two input{display:block;width:100%;margin-top:6px;max-width:100%;padding:11px 10px;border:1px solid #d9e7dc;border-radius:10px;background:white;color:#24433a;font:inherit;font-weight:500}
.analysis-output{border:1px solid #d0eddd;background:#f0faf4;border-radius:15px;padding:16px;margin:14px 0}
.analysis-output .output-label{font-size:11px;color:#4b7d69;font-weight:800}
.analysis-output strong{font-size:33px;display:block;color:#096e58;line-height:1.2;margin:7px 0 10px}
.analysis-output strong.hmm-state{font-size:28px}
.analysis-output small{font-size:10px;color:#6d8c7f}
.meter{width:100%;height:9px;border-radius:99px;overflow:hidden;background:#dce9e2}
.meter i{height:100%;display:block;background:#12a276;border-radius:99px;transition:width .2s}
.evidence-list{margin:18px 0}
.evidence-list>div{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;padding:11px 0;border-bottom:1px solid #e9f1eb}
.evidence-yes{color:#18866e}.evidence-no{color:#be7864}
.formula-line{font-size:12px;color:#365e50;background:#f3f8f4;border-radius:10px;padding:13px;margin-bottom:13px;overflow-wrap:anywhere}
.analysis-probs>div{margin:14px 0}.prob-head{font-size:12px;display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.hmm-observations{background:#f8faf8;padding:12px 14px;border-radius:10px;font-size:12px;overflow-wrap:anywhere}
.hmm-observations strong,.hmm-observations span,.hmm-observations small{display:block;margin:4px 0}
.hmm-observations small{color:#779085}.viterbi-path{background:#f5f9f6;border-radius:10px;padding:11px 13px;font-size:12px;line-height:1.7;margin:12px 0}
.viterbi-path p{margin:5px 0;color:#4c7564}
.pipeline{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:12px 0}.pipeline span{padding:8px 10px;background:#e9f6ef;border-radius:9px;color:#26725a;font-size:11px;font-weight:800}
.pipeline em{font-style:normal;color:#a5b9ad}
@media(max-width:1050px){.analysis-grid{grid-template-columns:1fr}}
@media(max-width:680px){.analysis-card{padding:16px}.analysis-two{grid-template-columns:1fr}.analysis-output strong{font-size:29px}.bayes-metric{font-size:24px}}
</style>
</head>

<div class="app">

    <div class="nav-title">НЕГІЗГІ МӘЗІР</div>

<script>
(function(){'use strict';
const svgPaths={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',hand:'<path d="M8 13 6.5 12a2 2 0 0 0-3.2 1.9l.5 2.5a3 3 0 0 0 1.8 2.2l5.8 2.4a5 5 0 0 0 3.4.1l4.2-1.5a3 3 0 0 0 1.9-2.6l.2-2a2 2 0 0 0-2.2-2.2l-4.4.8"/><path d="M8 13V5a1.5 1.5 0 0 1 3 0v7-8a1.5 1.5 0 0 1 3 0v8-7a1.5 1.5 0 0 1 3 0v8"/>',plus:'<path d="M12 5v14M5 12h14"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',spark:'<path d="m12 3 1.9 5.7L20 11l-6.1 2.3L12 19l-1.9-5.7L4 11l6.1-2.3L12 3zM19 17l.9 2.1L22 20l-2.1.9L19 23l-.9-2.1L16 20l2.1-.9L19 17z"/>',shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>',map:'<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/>',pin:'<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',check:'<path d="m4 12 5 5L20 6"/>',checkcircle:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',chevron:'<path d="m9 18 6-6-6-6"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',package:'<path d="m12 2 9 5v10l-9 5-9-5V7l9-5ZM3 7l9 5 9-5M12 12v10"/>',book:'<path d="M4 19V5a2 2 0 0 1 2-2h14v18H6a2 2 0 0 1-2-2ZM4 17c0-1 1-2 3-2h13"/>',chat:'<path d="M21 11a8 8 0 0 1-8 8 9 9 0 0 1-4-.9L3 21l1.9-5A8 8 0 1 1 21 11Z"/>',access:'<circle cx="12" cy="4" r="2"/><path d="m4 9 8 2 8-2M12 11v5m0 0-4 6m4-6 4 6"/>',bolt:'<path d="m13 2-9 12h7l-1 8 10-12h-7z"/>',warning:'<path d="m12 3 10 18H2L12 3ZM12 9v5m0 3h.01"/>',reset:'<path d="M3 12a9 9 0 1 0 2-6l-2 2M3 3v5h5"/>',close:'<path d="M18 6 6 18M6 6l12 12"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',filter:'<path d="M4 5h16l-6 7v6l-4 2v-8z"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',gift:'<rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8C5 8 5 3 8 3c2 0 4 3 4 5Zm0 0c7 0 7-5 4-5-2 0-4 3-4 5Z"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7h.01"/>',smile:'<circle cx="12" cy="12" r="9"/><path d="M8 14c2 3 6 3 8 0M8.5 9h.01M15.5 9h.01"/>',settings:'<path d="M10 3h4l1 3 3 1 3-1 2 4-2 2 0 2 2 2-2 4-3-1-3 1-1 3h-4l-1-3-3-1-3 1-2-4 2-2v-2l-2-2 2-4 3 1 3-1 1-3z"/><circle cx="12" cy="12" r="3"/>',play:'<path d="m8 5 12 7-12 7V5z"/>',star:'<path d="m12 2 3 6.5 7 1-5 5 1.2 7-6.2-3.3-6.2 3.3L7 14.5l-5-5 7-1L12 2z"/>'};
function ic(name,cls=''){return `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${svgPaths[name]||svgPaths.heart}</svg>`}
const categories={food:{label:'Азық-түлік',icon:'gift'},delivery:{label:'Зат жеткізу',icon:'package'},study:{label:'Оқуға көмек',icon:'book'},social:{label:'Әлеуметтік қолдау',icon:'heart'},access:{label:'Қолжетімділік',icon:'access'},event:{label:'Іс-шара',icon:'users'}};
const areas=['Есіл','Нұра','Сарыарқа','Алматы','Байқоңыр'];
const volunteers=[{id:'v1',name:'Аружан К.',initial:'АК',area:'Есіл',skills:['food','delivery','social'],availability:true,load:0},{id:'v2',name:'Данияр М.',initial:'ДМ',area:'Сарыарқа',skills:['food','delivery','event'],availability:true,load:1},{id:'v3',name:'Меруерт Т.',initial:'МТ',area:'Нұра',skills:['study','social','food'],availability:true,load:0},{id:'v4',name:'Әлихан С.',initial:'ӘС',area:'Алматы',skills:['delivery','access','event'],availability:true,load:1},{id:'v5',name:'Аяулым Н.',initial:'АН',area:'Байқоңыр',skills:['study','social','event'],availability:true,load:0},{id:'v6',name:'Ерасыл Б.',initial:'ЕБ',area:'Есіл',skills:['food','delivery','access'],availability:false,load:0}];
const baseRequests=[{id:'r101',title:'Азық-түлік әкелуге көмек керек',category:'food',desc:'Үлкен кісінің күнделікті азық-түлік тізімін дүкеннен жеткізу қажет. Сатып алуды ұйымдастыру жолын алдын ала келісеміз.',area:'Есіл',when:'Бүгін',urgency:'soon',owner:'Айгүл апай',mine:false,status:'open',created:1},{id:'r102',title:'Кітаптарды жеткізуге көмектесу',category:'delivery',desc:'Кітапханаға берілетін 2 шағын қорап кітапты жеткізуге көмектесетін ерікті іздеймін.',area:'Нұра',when:'Ертең',urgency:'normal',owner:'Нұрасыл',mine:false,status:'open',created:2},{id:'r103',title:'Математикадан сабақ түсіндіру',category:'study',desc:'8-сынып оқушысына 40 минут алгебрадан негізгі тақырыптарды түсіндіруге көмектесу керек. Онлайн формат та болады.',area:'Сарыарқа',when:'Апта ішінде',urgency:'normal',owner:'Әсем',mine:false,status:'open',created:3},{id:'r104',title:'Қоғамдық шараға ерікті керек',category:'event',desc:'Ауладағы экологиялық тазалық акциясына қоқысты сұрыптауға көмектесетін волонтерлер қажет.',area:'Алматы',when:'Ертең',urgency:'normal',owner:'Қауымдастық',mine:false,status:'open',created:4},{id:'r105',title:'Оқу материалдарын апару',category:'delivery',desc:'Оқу орталығындағы дәптерлер мен оқу құралдарын келісілген қоғамдық жерде беру қажет.',area:'Байқоңыр',when:'Бүгін',urgency:'soon',owner:'Салтанат',mine:false,status:'open',created:5},{id:'r106',title:'Онлайн өтініш толтыруға көмек',category:'social',desc:'Электронды қызмет сайтындағы жалпы навигацияны көрсететін ерікті іздеймін. Құпиясөз немесе код сұралмайды.',area:'Есіл',when:'Апта ішінде',urgency:'normal',owner:'Болат',mine:false,status:'open',created:6}];
const STORAGE='asar_ai_public_prototype_v1';
const clone=arr=>JSON.parse(JSON.stringify(arr));
function loadSaved(){try{const d=JSON.parse(localStorage.getItem(STORAGE)||'null');if(d&&Array.isArray(d.requests))return d;}catch(e){}return {requests:clone(baseRequests),role:'seeker'}}
let saved=loadSaved();let state={analyticsScenario:'normal',analyticsCountOverride:null,analyticsRequest:'',analyticsVolunteer:'',requests:saved.requests,role:saved.role==='helper'?'helper':'seeker',page:'home',category:'all',area:'all',search:'',matchId:'',selectedVolunteer:'',modalId:null};
function save(){try{localStorage.setItem(STORAGE,JSON.stringify({requests:state.requests,role:state.role}));}catch(e){}}
const e=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const get=id=>state.requests.find(x=>x.id===id);
const statusText={open:'Ашық',in_progress:'Орындалуда',awaiting_confirmation:'Растау күтілуде',completed:'Аяқталды'};
const tagFor={open:'green',in_progress:'blue',awaiting_confirmation:'orange',completed:'gray'};
const pages={home:'Басты бет',browse:'Көмек көрсету',create:'Көмек сұрау',mine:'Менің өтініштерім',match:'AI сәйкестендіру',analytics:'AI аналитика',community:'Қауымдастық'};
const navs=[['home','home','Басты бет'],['browse','heart','Көмек көрсету'],['create','plus','Көмек сұрау'],['mine','list','Менің өтініштерім'],['match','spark','AI сәйкестендіру'],['analytics','bolt','AI аналитика'],['community','users','Қауымдастық']];
function nav(){document.getElementById('navigation').innerHTML=navs.map(([id,icon,label])=>`<button data-nav="${id}" class="nav-item ${id===state.page?'active':''}">${ic(icon)}<span>${label}</span>${id==='browse'?`<span class="nav-count">${state.requests.filter(r=>r.status==='open').length}</span>`:''}</button>`).join('');document.getElementById('topTitle').textContent=pages[state.page];document.getElementById('rolePicker').value=state.role}
function demoBanner(){return `<div class="demo-ribbon"><span>${ic('info')} Бұл — демо-прототип. Өтініштер мен еріктілер ойдан құрастырылған, нақты хабарламалар жіберілмейді.</span><button data-action="reset" class="text-link reset-button" style="color:#936b31">Демоны қалпына келтіру</button></div>`}
function requestCard(r,mode='list'){const meta=`<div class="request-meta"><span>${ic('pin')}${e(r.area)} ауданы</span><span>${ic('clock')}${e(r.when)}</span></div>`;let btn;if(r.status==='open')btn=`<button class="btn btn-primary btn-small" data-action="${mode==='mine'&&state.role==='seeker'?'matchpage':'accept'}" data-id="${e(r.id)}">${mode==='mine'&&state.role==='seeker'?'Ерікті іздеу':'Көмектесу'} ${ic('arrow')}</button>`;else if(r.status==='in_progress'&&r.assignedTo==='demo-helper'&&state.role==='helper')btn=`<button class="btn btn-outline btn-small" data-action="finish" data-id="${e(r.id)}">Аяқтадым ${ic('check')}</button>`;else if(r.status==='awaiting_confirmation'&&r.mine&&state.role==='seeker')btn=`<button class="btn btn-primary btn-small" data-action="confirm" data-id="${e(r.id)}">Көмекті растау ${ic('check')}</button>`;else btn=`<button class="btn btn-outline btn-small" data-action="details" data-id="${e(r.id)}">Толығырақ ${ic('chevron')}</button>`;return `<article class="request-card"><div class="request-icon">${ic(categories[r.category]?.icon||'heart')}</div><div class="request-body"><div class="request-top"><div><h4 class="request-title">${e(r.title)}</h4>${mode==='mine'?`<span class="tag ${tagFor[r.status]||'gray'}">${statusText[r.status]||'Белгісіз'}</span>`:''}</div><span class="tag ${r.urgency==='soon'?'orange':'green'}">${r.urgency==='soon'?'Жақын арада':'Жоспарлы'}</span></div><p class="request-desc">${e(r.desc)}</p>${meta}<div class="request-footer"><span class="subtle" style="font-size:10.5px">${e(r.owner)} · ${e(categories[r.category]?.label||'Көмек')}</span>${btn}</div></div></article>`}
function totalStats(){const a=state.requests;return[{label:'Ашық өтініштер',num:a.filter(r=>r.status==='open').length,icon:'list',color:''},{label:'Демо еріктілер',num:volunteers.length,icon:'users',color:'blue'},{label:'Орындалуда',num:a.filter(r=>r.status==='in_progress'||r.status==='awaiting_confirmation').length,icon:'clock',color:'amber'},{label:'Аяқталған көмек',num:a.filter(r=>r.status==='completed').length,icon:'checkcircle',color:'violet'}]}
function home(){const cards=state.requests.filter(r=>r.status==='open').slice(0,3);return `${demoBanner()}<section class="hero"><div class="hero-text"><span class="hero-label">${ic('heart')} Адамдарға арналған ақылды көмек платформасы</span><h2>Жақсылық жасау —<br/>бір қадамнан басталады.</h2><p>Көмек керек пе? Немесе біреуге қол ұшын созғың келе ме? ASAR AI адамдарды біріктіріп, лайықты еріктіні табуға көмектеседі.</p><div class="hero-actions"><button class="btn btn-white btn-xl" data-nav="create">${ic('plus')} Көмек сұрау</button><button class="btn btn-dark btn-xl" data-nav="browse">Көмек көрсету ${ic('arrow')}</button></div></div><div class="hero-visual"><div class="hero-graphic"><span class="hero-bubble large">${ic('heart')}</span><span class="hero-bubble one">${ic('users')}</span><span class="hero-bubble two">${ic('checkcircle')}</span><span class="hero-bubble three">${ic('gift')}</span><span class="hero-dot"></span></div></div></section><section class="stats-grid">${totalStats().map(s=>`<div class="stat-card"><div><div class="stat-label">${s.label}</div><div class="stat-number">${s.num}</div></div><span class="stat-icon ${s.color}">${ic(s.icon)}</span></div>`).join('')}</section><section class="two-col"><div><div class="section-heading"><h3>Көмек күтетін өтініштер</h3><button class="see-all" data-nav="browse">Барлығын көру ${ic('arrow')}</button></div><div class="request-list">${cards.map(r=>requestCard(r,'home')).join('')||empty('Әзірге ашық өтініш жоқ','Жаңа өтініштер пайда болғанда осында көрсетіледі.')}</div></div><div><div class="section-heading"><h3>Белсенді еріктілер</h3><button class="see-all" data-nav="community">Барлығы ${ic('arrow')}</button></div><div class="card mini-people">${volunteers.filter(v=>v.availability).slice(0,4).map(v=>`<div class="person"><div class="person-avatar">${e(v.initial)}</div><div><strong>${e(v.name)}</strong><p>${e(v.area)} · ${v.skills.length} көмек түрі</p></div><div class="person-meta">● Қолжетімді</div></div>`).join('') function aStar(start,goal){if(!graph[start]||!graph[goal])return null;let open=[start],score={[start]:0},came={},closed=new Set();while(open.length){open.sort((a,b)=>(score[a]+dist(a,goal))-(score[b]+dist(b,goal)));const current=open.shift();if(current===goal){let path=[current];while(came[path[0]])path.unshift(came[path[0]]);return {path,cost:+score[current].toFixed(2),visited:closed.size+1}}closed.add(current);for(const next of graph[current].adj){const c=score[current]+dist(current,next)+.22;if(c<(score[next]??Infinity)){came[next]=current;score[next]=c;if(!open.includes(next))open.push(next);closed.delete(next)}}}return null}

// Week 6 Bayesian Network + Week 7 HMM from the mobile code; all values are synthetic.
const BAYES_MODEL = Object.freeze({
  priorAccepted: 0.45,
  features: Object.freeze({
    nearby:   { acceptedTrue: 0.75, declinedTrue: 0.35, label: 'Маршрут жақын (≤3 шартты бірлік)' },
    lowLoad:  { acceptedTrue: 0.80, declinedTrue: 0.50, label: 'Еріктінің жүктемесі төмен' },
    today:    { acceptedTrue: 0.60, declinedTrue: 0.45, label: 'Тапсырма бүгін' },
  }),
});
function bayesianAcceptance(evidence = {}, model = BAYES_MODEL) {
  const prior = model.priorAccepted;
  if (!(prior > 0 && prior < 1)) throw new RangeError('Invalid Bayesian prior');
  let likelihoodAccepted = 1, likelihoodDeclined = 1;
  const usedEvidence = [];
  for (const [key, cpt] of Object.entries(model.features)) {
    const observed = evidence[key];
    if (observed === undefined || observed === null) continue; // missing evidence is marginalized
    if (typeof observed !== 'boolean') throw new TypeError(`${key} must be boolean`);
    const pYes = observed ? cpt.acceptedTrue : 1 - cpt.acceptedTrue;
    const pNo = observed ? cpt.declinedTrue : 1 - cpt.declinedTrue;
    if (!(pYes >= 0 && pYes <= 1 && pNo >= 0 && pNo <= 1)) throw new RangeError('Invalid CPT');
    likelihoodAccepted *= pYes;
    likelihoodDeclined *= pNo;
    usedEvidence.push({ key, label: cpt.label, value: observed, pIfAccepted: pYes, pIfDeclined: pNo });
  }
  const acceptedJoint = prior * likelihoodAccepted;
  const declinedJoint = (1 - prior) * likelihoodDeclined;
  const normalizer = acceptedJoint + declinedJoint;
  if (!(normalizer > 0)) throw new RangeError('Impossible Bayesian evidence');
  return {
    prior, probability: acceptedJoint / normalizer,
    likelihoodAccepted, likelihoodDeclined, evidence: usedEvidence,
  };
}
function bayesianEstimate(request, volunteer) {
  const route = aStar(volunteer.area, request.area);
  if (!route) return null;
  const observed = {
    nearby: route.cost <= 3,
    lowLoad: (volunteer.load || 0) === 0,
    today: request.when === 'Бүгін',
  };
  return { ...bayesianAcceptance(observed), observed, routeCost: route.cost };
}

/**
 * 7-АПТА — discrete Hidden Markov Model for aggregate help-demand backlog.
 * Hidden states: low, medium, high community load.
 * Observable categories: open requests count <=1, 2..3, >=4.
 * Forward: alpha_t(j) proportional to emission(j,o_t)*sum_i alpha_(t-1)(i)*T(i,j).
 * Viterbi: max-product (log-domain) estimates a most likely hidden state path.
 * Transition and emission matrices are SYNTHETIC demo assumptions.
 */
const DEMAND_HMM = Object.freeze({
  states: ['Төмен', 'Орташа', 'Жоғары'],
  observations: ['Аз', 'Қалыпты', 'Көп'],
  initial: [0.55, 0.32, 0.13],
  transition: [
    [0.74, 0.23, 0.03],
    [0.18, 0.65, 0.17],
    [0.05, 0.25, 0.70],
  ],
  emission: [
    [0.78, 0.20, 0.02],
    [0.15, 0.68, 0.17],
    [0.04, 0.24, 0.72],
  ],
});
const normalize = a => {
  const z = a.reduce((sum, x) => sum + x, 0);
  if (!(z > 0)) throw new RangeError('Impossible HMM observation');
  return a.map(x => x / z);
};
function demandObservation(count) {
  if (!Number.isInteger(count) || count < 0) throw new RangeError('Request count must be a nonnegative integer');
  return count <= 1 ? 0 : count <= 3 ? 1 : 2;
}
function inferDemandHMM(counts, model = DEMAND_HMM) {
  if (!Array.isArray(counts) || counts.length > 365) throw new RangeError('Invalid HMM series');
  const obs = counts.map(demandObservation);
  const n = model.states.length;
  const trace = [];
  let belief = normalize(model.initial.slice());
  for (let t = 0; t < obs.length; t++) {
    // t=0 uses the initial state distribution; subsequent steps predict via T.
    const predicted = t === 0 ? belief : belief.map((_, j) =>
      belief.reduce((acc, p, i) => acc + p * model.transition[i][j], 0));
    belief = normalize(predicted.map((p, j) => p * model.emission[j][obs[t]]));
    trace.push(belief.slice());
  }
  const nextProbabilities = normalize(belief.map((_, j) =>
    belief.reduce((acc, p, i) => acc + p * model.transition[i][j], 0)));
  let path = [];
  if (obs.length) {
    let prev = model.initial.map((p, s) => Math.log(p) + Math.log(model.emission[s][obs[0]]));
    const back = [];
    for (let t = 1; t < obs.length; t++) {
      const ptr = [];
      const next = [];
      for (let j = 0; j < n; j++) {
        let arg = 0, best = -Infinity;
        for (let i = 0; i < n; i++) {
          const v = prev[i] + Math.log(model.transition[i][j]);
          if (v > best) { best = v; arg = i; }
        }
        next[j] = best + Math.log(model.emission[j][obs[t]]);
        ptr[j] = arg;
      }
      back.push(ptr);
      prev = next;
    }
    let state = prev.indexOf(Math.max(...prev));
    path = [state];
    for (let t = back.length - 1; t >= 0; t--) {
      state = back[t][state];
      path.unshift(state);
    }
  }
  const current = belief.indexOf(Math.max(...belief));
  const next = nextProbabilities.indexOf(Math.max(...nextProbabilities));
  return {
    counts: counts.slice(), observationIndices: obs,
    observationLabels: obs.map(i => model.observations[i]),
    trace, posterior: belief,
    currentState: model.states[current], currentStateIndex: current,
    nextProbabilities, nextState: model.states[next], nextStateIndex: next,
    viterbiPath: path.map(i => model.states[i]),
  };
}
/** Synthetic backlog snapshots for six past periods + the live local current backlog. */
const DEMO_DEMAND_HISTORY = Object.freeze({
  quiet: [0, 1, 1, 0, 2, 1],
  normal: [1, 2, 1, 3, 2, 3],
  busy: [2, 4, 5, 6, 4, 7],
});
function demandForecastFromRequests(requests, scenario = 'normal') {
  const history = DEMO_DEMAND_HISTORY[scenario];
  if (!history) throw new RangeError('Unknown demand scenario');
  const currentOpen = requests.filter(r => r.status === 'open').length;
  return inferDemandHMM([...history, currentOpen]);
}

s="match-score"><strong>${v.score}%</strong><small>ережелік балл</small><small class="bayes-inline">Bayesian: ${Math.round(v.bayes.probability*100)}%</small></div></div>`).join(''):`<div class="muted-box" style="margin-top:12px">Сәйкес ерікті табылмады. Шектеулерді орындамаған адамдар тізімге кірмейді.</div>`}<hr class="divider"/><div class="muted-box">${ic('info')} Сәйкестік пайызы — демонстрациялық ережелік есеп. Бұл оқытылған ML моделінің сенімділік ықтималдығы емес.</div>${ranked.length?`<button class="btn btn-primary" style="margin-top:15px" data-action="recommend" data-id="${e(req.id)}">${ic('checkcircle')} ${e(pick?.name||'Еріктіні')} ұсыну</button>`:''}</div><div class="ai-note"><strong>${ic('spark')} ASAR AI шешімі қалай шығады?</strong><p>Ең алдымен еріктінің бос уақыты мен тапсырма түріне сәйкестігі тексеріледі. Содан кейін жолдың шартты құны мен жүктемесі бойынша балл есептеледі. Нақты ерікті тек өзі келіскен соң ғана тапсырмаға бекітіледі.</p></div></section><section><div class="card map-card"><h3>${ic('map')} A* маршрут симуляциясы</h3><p class="map-sub">Оқу мақсатындағы шартты аудан графы. Бұл нақты көше картасы емес.</p>${mapGraphic(rt?.path||[])}${rt?`<div class="route-result"><b>Бағыт:</b> ${rt.path.map(e).join(' → ')}<br/><b>Жол шығыны:</b> ${rt.cost} шартты бірлік · <b>Қаралған түйіндер:</b> ${rt.visited}</div>`:`<p class="route-result">Маршрут таңдау үшін сәйкес ерікті қажет.</p>`}</div><div class="card hmm-compact"><div class="bayes-mark">⑦ HIDDEN MARKOV MODEL</div><h3>Көмек сұранысының жүктемесі</h3><div class="hmm-big">${demandForecastFromRequests(state.requests,state.analyticsScenario).nextState}</div><p>Келесі кезеңнің ең ықтимал жағдайы. Ағымдағы ашық өтініштер саны: ${state.requests.filter(r=>r.status==='open').length}</p><button data-nav="analytics" class="text-link">Forward / Viterbi нәтижесін көру →</button></div><div class="card" style="padding:19px;margin-top:16px"><div style="font-size:12px;font-weight:800;margin-bottom:11px">AI модульдер мәртебесі</div><div class="chip-row">${['Agent','A*','CSP','Bayesian','HMM'].map(t=>`<span class="chip"><i class="status-dot"></i>${t} · MVP</span>`).join('')}${['Minimax','RL','ML','NN','LLM'].map(t=>`<span class="chip" style="background:#fbf5e9;color:#9a8054"><i class="status-dot next"></i>${t} · жоспарда</span>`).join('')}</div></div></section></div>`:empty('Ашық өтініш жоқ','Жаңа өтініш құрып, сәйкестендіруді қайта сынаңыз.')}<section style="margin-top:25px"><div class="section-heading"><h3>10 AI тақырыбының даму картасы</h3><span class="tag orange">5 модуль келесі кезеңде</span></div><div class="lab-grid">${[['1','Intelligent Agents','Қабылдау және үйлестіру',true],['2','A* / Search','Шартты маршрут есептеу',true],['3','CSP / Local Search','Шектеу және оңтайландыру',true],['4','Adversarial Search','Қиын сценарийлер симуляциясы',false],['5','Reinforcement Learning','Хабарлама стратегиясы',false],['6','Bayesian Networks','Қабылдау ықтималдығы',true],['7','HMM','Сұраныс жүктемесін болжау',true],['8','Classical ML','Өтініш классификациясы',false],['9','Neural Networks','Суреттерді жіктеу',false],['10','LLM & AI Safety','Тілдік көмекші және қауіпсіздік',false]].map(x=>`<div class="lab-card"><span class="num">${x[0]}</span><div><strong>${x[1]}</strong><small>${x[2]} · ${x[3]?'іске асырылған':'жоспарда'}</small></div><span style="margin-left:auto" class="tag ${x[3]?'green':'orange'}">${x[3]?'MVP':'Кейін'}</span></div>`).join('')}</div></section>${footer()}`}
function analysisPage(){
  const open=state.requests.filter(r=>r.status==='open');
  if(!open.some(r=>r.id===state.analyticsRequest))state.analyticsRequest=open[0]?.id||'';
  const req=get(state.analyticsRequest);
  const ranked=ranking(req);
  if(!ranked.some(v=>v.id===state.analyticsVolunteer))state.analyticsVolunteer=ranked[0]?.id||'';
  const pick=ranked.find(v=>v.id===state.analyticsVolunteer);
  const historical=DEMO_DEMAND_HISTORY[state.analyticsScenario]||DEMO_DEMAND_HISTORY.normal;
  const live=state.requests.filter(r=>r.status==='open').length;
  const observed=state.analyticsCountOverride===null?live:state.analyticsCountOverride;
  const hmm=inferDemandHMM([...historical,observed]);
  const evidence=pick?.bayes?.evidence||[];
  return `${demoBanner()}<div class="page-intro"><div><h2>AI аналитика · 6 және 7-апта</h2><p>Bayesian ерікті ұсынысының қабылдануын есептейді, HMM өтініштердің агрегатталған жүктемесін болжайды. Екеуі де осы ASAR AI демосының ішінде жұмыс істейді.</p></div><span class="tag green">5 AI тақырыбы · Бір жоба</span></div>
  <div class="analysis-grid"><section class="card analysis-card"><div class="bayes-mark">⑥ BAYESIAN NETWORK</div><h3>Еріктінің ұсынысты қабылдау ықтималдығы</h3><p class="analysis-sub">Алдымен CSP жарамды еріктілерді сүзеді. A* маршрут есептейді. Осы нәтижелер Bayesian моделіне дәлел болады.</p>
  <div class="analysis-two"><label>Көмек өтініші<select id="analyticsRequest">${open.map(r=>`<option value="${e(r.id)}" ${r.id===state.analyticsRequest?'selected':''}>${e(r.title)}</option>`).join('')}</select></label><label>Сәйкес ерікті<select id="analyticsVolunteer">${ranked.map(v=>`<option value="${e(v.id)}" ${v.id===state.analyticsVolunteer?'selected':''}>${e(v.name)}</option>`).join('')}</select></label></div>
  ${pick?`<div class="analysis-output"><div class="output-label">P(қабылдайды | дәлелдер)</div><strong>${(100*pick.bayes.probability).toFixed(1)}%</strong><div class="meter"><i style="width:${(100*pick.bayes.probability).toFixed(1)}%"></i></div><small>Бастапқы prior: 45%. Нәтиже дәлелдерге байланысты өзгереді.</small></div><div class="evidence-list">${evidence.map(v=>`<div><span>${e(v.label)}</span><b class="${v.value?'evidence-yes':'evidence-no'}">${v.value?'ИӘ':'ЖОҚ'}</b></div>`).join('')}</div><p class="analysis-sub">A* жол құны: ${pick.route.cost} шартты бірлік · Эвристикалық сәйкестік баллы: ${pick.score}%. Екеуі Bayesian ықтималдығынан бөлек көрсетіледі.</p>`:`<div class="muted-box">Ашық өтінішке сәйкес ерікті табылмады. «Көмек сұрау» бөлімінде жаңа өтініш жасаңыз.</div>`}
  <div class="formula-line">P(A|E) = P(A)×P(E|A) / [P(A)×P(E|A)+P(¬A)×P(E|¬A)]</div><div class="ai-note"><strong>${ic('info')} Нақты дерек емес</strong><p>Шартты ықтималдықтар оқу мақсатында ойдан берілген. Адамның шынайы сенімділігін бағаламайды.</p></div></section>
  <section class="card analysis-card"><div class="bayes-mark">⑦ HIDDEN MARKOV MODEL</div><h3>Көмек сұранысының болжамы</h3><p class="analysis-sub">Жасырын күй: төмен, орташа, жоғары жүктеме. Бақылау: ашық өтініштер саны. Forward ықтималдықтарды жаңартады, Viterbi күйлер жолын табады.</p>
  <div class="analysis-two"><label>Алдыңғы кезеңдер (демо)<select id="hmmScenario"><option value="quiet" ${state.analyticsScenario==='quiet'?'selected':''}>Тыныш</option><option value="normal" ${state.analyticsScenario==='normal'?'selected':''}>Қалыпты</option><option value="busy" ${state.analyticsScenario==='busy'?'selected':''}>Қарбалас</option></select></label><label>Қазіргі ашық өтініш саны<input type="number" id="hmmCount" min="0" max="30" step="1" value="${observed}"/></label></div>
  <p class="analysis-sub">Нақты демо қосымшадағы ашық өтініш: <b>${live}</b>. Көрсеткішті өзгертіп HMM-ді тексере аласың. <button data-action="useLiveDemand" class="text-link">Нақты демо санын пайдалану</button></p>
  <div class="hmm-observations"><strong>Бақылаулар</strong><span>${hmm.counts.join(' → ')}</span><small>Санаттар: ${hmm.observationLabels.join(' · ')}</small></div>
  <div class="analysis-output"><div class="output-label">Қазіргі жасырын күй (Forward)</div><strong class="hmm-state">${hmm.currentState}</strong><div class="output-label" style="margin-top:7px">Келесі кезеңнің ықтимал күйі: <b>${hmm.nextState}</b></div></div>
  <div class="analysis-probs">${DEMAND_HMM.states.map((s,i)=>`<div><div class="prob-head"><span>${s}</span><b>${(hmm.nextProbabilities[i]*100).toFixed(1)}%</b></div><div class="meter"><i style="width:${(hmm.nextProbabilities[i]*100).toFixed(1)}%;background:${['#16946e','#e1aa40','#d16e57'][i]}"></i></div></div>`).join('')}</div>
  <div class="viterbi-path"><strong>Viterbi күй тізбегі:</strong><p>${hmm.viterbiPath.join(' → ')}</p></div><div class="ai-note"><strong>${ic('info')} Модельдің шектеуі</strong><p>Алдыңғы 6 кезең — синтетикалық сандар. Transition және emission матрицалары алдын ала берілген, бұл нақты қала сұранысына кепілдік емес.</p></div></section></div>
  <section class="card" style="padding:20px;margin-top:17px"><h3>Бір өтінішке арналған 5 модульдің ортақ жұмысы</h3><div class="pipeline"><span>Agent</span><em>→</em><span>CSP</span><em>→</em><span>A*</span><em>→</em><span>Bayesian</span><em>→</em><span>Еріктіге ұсыныс</span></div><div class="pipeline"><span>Ашық өтініштер</span><em>→</em><span>HMM Forward + Viterbi</span><em>→</em><span>Жүктемені болжау</span></div><p class="analysis-sub">Қосымшадағы барлық өңдеу жергілікті браузерде өтеді: серверге немесе AI API-ге сұрау жіберілмейді.</p></section>${footer()}`;
}

function community(){return `${demoBanner()}<div class="page-intro"><div><h2>ASAR қауымдастығы</h2><p>Платформаның демонстрациялық еріктілері. Сәйкестендіру алгоритмі олардың дағдыларын, бос уақытын және ауданын пайдаланады.</p></div><span class="tag green">${volunteers.filter(v=>v.availability).length} қолжетімді</span></div><div class="community-grid">${volunteers.map(v=>`<div class="volunteer-card"><div class="person-avatar">${e(v.initial)}</div><h3>${e(v.name)}</h3><p>${ic('pin')} ${e(v.area)} ауданы</p><div style="margin-bottom:13px"><span class="tag ${v.availability?'green':'gray'}">${v.availability?'● Қолжетімді':'○ Қазір бос емес'}</span></div><div class="chip-row">${v.skills.map(x=>`<span class="chip">${e(categories[x].label)}</span>`).join('')}</div></div>`).join('')}</div><div class="helper-banner" style="margin-top:21px"><span>${ic('shield')} <b>Маңызды:</b> бұл тізімдегі адамдар — ойдан шығарылған демо профильдер. Нақты еріктілерді тіркеу, тексеру және келісім алу кейінгі кезеңде жүзеге асырылады.</span></div>${footer()}`}
function render(){nav();const target=document.getElementById('content');target.innerHTML={home,browse,create:createPage,mine,match:matchPage,analytics:analysisPage,community}[state.page]();if(state.page==='browse')document.getElementById('browseResults').innerHTML=browseResults();document.getElementById('rolePicker').value=state.role;document.getElementById('side-heart').innerHTML=ic('heart');document.getElementById('menuToggle').innerHTML=ic('menu');document.getElementById('roleIcon').innerHTML=ic('users');}

let timer;function toast(message){const el=document.getElementById('toastRoot');el.innerHTML=`<div class="toast">${ic('checkcircle')} ${e(message)}</div>`;clearTimeout(timer);timer=setTimeout(()=>el.innerHTML='',4100)}

function reset(){if(!window.confirm('Демо деректерді қайта бастаймыз ба? Өзіңіз жасаған өтініштер өшіріледі.'))return;state.requests=clone(baseRequests);state.role='seeker';state.matchId='';state.selectedVolunteer='';state.analyticsScenario='normal';state.analyticsCountOverride=null;state.analyticsVolunteer='';state.analyticsRequest='';save();toast('Демо қалпына келтірілді');goto('home')}
function validRequest(title,desc){const sensitive=/(?:\+?7[\s\-(]?(?:\d[\s\-()]?){9,11}|\b\d{12}\b|(?:sms\s*код|пароль|құпиясөз)\s*[:=])/iu;return !sensitive.test(title+' '+desc)}
function submitRequest(f){const data=new FormData(f),title=String(data.get('title')||'').trim(),desc=String(data.get('desc')||'').trim(),category=String(data.get('category')||''),area=String(data.get('area')||''),when=String(data.get('when')||''),urgency=String(data.get('urgency')||'normal');if(title.length<6||desc.length<15||!categories[category]||!areas.includes(area)||!['Бүгін','Ертең','Апта ішінде'].includes(when))return toast('Міндетті жолдарды дұрыс толтырыңыз.');if(!validRequest(title,desc))return toast('Өтініштен жеке байланыс не құпия деректерді алып тастаңыз.');const req={id:'r'+Date.now()+Math.random().toString(36).slice(2,6),title,desc,category,area,when,urgency,owner:'Мен (демо)',mine:true,status:'open',created:Date.now()};state.requests.unshift(req);state.role='seeker';state.matchId=req.id;save();toast('Өтініш сәтті қосылды! Енді AI арқылы ерікті таба аласыз.');goto('mine')}
function onAction(el,event){const action=el.dataset.action,id=el.dataset.id;if(action==='details')detail(id);if(action==='close')closeModal();if(action==='closeOutside'&&event.target===el)closeModal();if(action==='accept')accept(id);if(action==='finish')finish(id);if(action==='confirm')confirm(id);if(action==='reset')reset();if(action==='matchpage'){state.matchId=id;goto('match')}if(action==='pickVolunteer'){state.selectedVolunteer=id;render()}if(action==='recommend')recommend(id);if(action==='useLiveDemand'){state.analyticsCountOverride=null;render()}}
document.addEventListener('click',ev=>{const n=ev.target.closest('[data-nav]');if(n){goto(n.dataset.nav);return}const a=ev.target.closest('[data-action]');if(a){onAction(a,ev);return}});
document.addEventListener('submit',ev=>{if(ev.target.id==='requestForm'){ev.preventDefault();submitRequest(ev.target)}});
document.addEventListener('input',ev=>{if(ev.target.id==='searchRequests'){state.search=ev.target.value;document.getElementById('browseResults').innerHTML=browseResults()}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.id==='rolePicker'){state.role=t.value;save();toast(state.role==='helper'?'Ерікті демо режимі қосылды.':'Көмек сұраушы демо режимі қосылды.');if(state.page==='mine')render();return}if(t.id==='categoryFilter'){state.category=t.value;document.getElementById('browseResults').innerHTML=browseResults()}if(t.id==='areaFilter'){state.area=t.value;document.getElementById('browseResults').innerHTML=browseResults()}if(t.id==='matchRequest'){state.matchId=t.value;state.selectedVolunteer='';render()}if(t.id==='analyticsRequest'){state.analyticsRequest=t.value;state.analyticsVolunteer='';render()}if(t.id==='analyticsVolunteer'){state.analyticsVolunteer=t.value;render()}if(t.id==='hmmScenario'){state.analyticsScenario=t.value;render()}if(t.id==='hmmCount'){let n=Number(t.value);if(!Number.isInteger(n)||n<0||n>30){toast('0–30 аралығындағы бүтін санды енгізіңіз.');render();return}state.analyticsCountOverride=n;render()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal()});
document.getElementById('menuToggle').addEventListener('click',()=>{document.getElementById('sidebar').classList.toggle('open');document.getElementById('scrim').classList.toggle('hide')});document.getElementById('scrim').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.add('hide')});
// Algorithm self-tests are available from the browser console: ASAR_TESTS.run()
window.ASAR_TESTS={run:()=>{const results=[];function test(name,p){results.push({test:name,passed:!!p})}test('A* same node',aStar('Есіл','Есіл').cost===0);test('A* route exists',aStar('Нұра','Алматы').path.length>=2);test('CSP unavailable volunteer excluded',!ranking({category:'food',area:'Есіл'}).some(v=>v.id==='v6'));test('CSP category matched',ranking({category:'study',area:'Нұра'}).every(v=>v.skills.includes('study')));test('Ranking sorted',ranking({category:'delivery',area:'Есіл'}).every((v,i,arr)=>!i||arr[i-1].score>=v.score));test('Sensitive data blocked',!validRequest('Өтініш','Менің нөмірім +77011234567'));test('Clean text accepted',validRequest('Көмек','Кітап алып баруға жәрдем керек'));
  const close=(a,b)=>Math.abs(a-b)<1e-9;
  test('Bayes prior',close(bayesianAcceptance({}).probability,0.45));
  test('Bayes positive evidence raises posterior',bayesianAcceptance({nearby:true,lowLoad:true,today:true}).probability>0.45);
  test('Bayes negative evidence reduces posterior',bayesianAcceptance({nearby:false,lowLoad:false,today:false}).probability<0.45);
  test('Bayes complete evidence used',bayesianAcceptance({nearby:false,lowLoad:true,today:true}).evidence.length===3);
  test('Bayes real demo volunteer',ranking({category:'food',area:'Есіл',when:'Бүгін'}).every(v=>v.bayes.probability>=0&&v.bayes.probability<=1));
  test('HMM count bin small',demandObservation(1)===0);
  test('HMM count bin medium',demandObservation(3)===1);
  test('HMM count bin high',demandObservation(4)===2);
  const quiet=inferDemandHMM([0,1,0,1,1,0]);
  const busy=inferDemandHMM([4,5,6,5,4,6]);
  test('HMM normalized posterior',close(quiet.posterior.reduce((a,b)=>a+b,0),1));
  test('HMM normalized next',close(busy.nextProbabilities.reduce((a,b)=>a+b,0),1));
  test('HMM Viterbi path length',busy.viterbiPath.length===6);
  test('HMM responds to scenarios',quiet.nextState!==busy.nextState);
  test('HMM updates from live requests',demandForecastFromRequests(state.requests).counts.at(-1)===state.requests.filter(r=>r.status==='open').length);
  console.table(results);return results}};
render();
})();
</script>
